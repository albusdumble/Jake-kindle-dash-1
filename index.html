<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake's Kindle Dashboard</title>
<style>
html, body {
  margin: 0; padding: 0;
  font-family: Georgia, serif;
  background: #fff; color: #000;
  font-size: 22px;
  display: flex; justify-content: center;
}
.wrapper {
  width: 600px;
  padding: 10px;
  box-sizing: border-box;
}
.module {
  border: 1px solid #000;
  border-radius: 6px;
  padding: 10px;
  margin-bottom: 12px;
}
h2 {
  font-size: 1.2em;
  margin: 0 0 8px 0;
  border-bottom: 1px solid #000;
  padding-bottom: 4px;
}
ul { margin: 0; padding-left: 20px; line-height: 1.4; }
.weather-line { margin: 4px 0; }
#todos input[type="checkbox"] { margin-right: 6px; }
#new-todo { width: 70%; font-size: 1em; }
button { font-size: 1em; padding: 4px 8px; margin-left: 4px; }
#completed-list { border-top: 1px solid #888; margin-top: 10px; padding-top: 6px; }
</style>
</head>
<body>

<div class="wrapper">
  <div class="module" id="calendar">
    <h2>Calendar</h2>
    <ul id="calendar-list"><li>Loading calendar...</li></ul>
  </div>

  <div class="module" id="weather">
    <h2>Weather</h2>
    <div id="weather-content">Loading weather...</div>
  </div>

  <div class="module" id="quote">
    <h2>Daily Quote</h2>
    <p id="quote-text">Loading quote...</p>
  </div>

  <div class="module" id="todos">
    <h2>To-Dos</h2>
    <ul id="todo-list"></ul>
    <div>
      <input id="new-todo" type="text" placeholder="Add task...">
      <button onclick="addTodo()">Add</button>
    </div>
    <div id="completed-list">
      <strong>Completed:</strong>
      <ul id="done-list"></ul>
      <button onclick="clearDone()">Clear Completed</button>
    </div>
  </div>
</div>

<script>
// ---------- Calendar ----------
function loadCalendar() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "calendar.json", true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      var ul = document.getElementById("calendar-list");
      if (xhr.status === 200) {
        try {
          var events = JSON.parse(xhr.responseText);
          ul.innerHTML = "";
          if (!events.length) {
            ul.innerHTML = "<li>No upcoming events</li>";
            return;
          }
          for (var i=0; i<events.length; i++) {
            var e = events[i];
            var d = new Date(e.date);
            var dateStr = formatDate(d);
            var li = document.createElement("li");
            li.textContent = dateStr + " – " + e.summary;
            ul.appendChild(li);
          }
        } catch (e) {
          ul.innerHTML = "<li>Calendar format error.</li>";
        }
      } else {
        ul.innerHTML = "<li>Offline or calendar unavailable.</li>";
      }
    }
  };
  xhr.send();
}

function formatDate(d) {
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var month = months[d.getMonth()];
  var day = d.getDate();
  var hours = d.getHours();
  var minutes = d.getMinutes();
  var ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12;
  if (hours === 0) hours = 12;
  if (minutes < 10) minutes = "0" + minutes;
  return month + " " + day + " " + hours + ":" + minutes + " " + ampm;
}

// ---------- Weather ----------
function loadWeather() {
  var xhr = new XMLHttpRequest();
  var url = "https://api.open-meteo.com/v1/forecast?latitude=33.285&longitude=-96.5717&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto";
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      var div = document.getElementById("weather-content");
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          var t = Math.round(data.current_weather.temperature);
          var w = Math.round(data.current_weather.windspeed);
          div.innerHTML = "Now: " + t + "°F, " + w + " mph wind";
        } catch (e) {
          div.innerText = "Weather parse error.";
        }
      } else {
        div.innerText = "Offline.";
      }
    }
  };
  xhr.send();
}

// ---------- Daily Quote ----------
var quotes = [
  "“Adam fell that men might be; and men are, that they might have joy.” — 2 Nephi 2:25",
  "“When ye are in the service of your fellow beings ye are only in the service of your God.” — Mosiah 2:17",
  "“If ye have faith ye hope for things which are not seen, which are true.” — Alma 32:21",
  "“By small and simple things are great things brought to pass.” — Alma 37:6",
  "“Charity is the pure love of Christ, and it endureth forever.” — Moroni 7:47",
  "“I will go and do the things which the Lord hath commanded.” — 1 Nephi 3:7",
  "“Press forward with a steadfastness in Christ.” — 2 Nephi 31:20",
  "“Ye shall have hope through the atonement of Christ and the power of his resurrection.” — Moroni 7:41",
  "“Come unto Christ, and be perfected in him.” — Moroni 10:32",
  "“Inasmuch as ye shall keep my commandments ye shall prosper in the land.” — 2 Nephi 1:20",
  "“The Lord seeth fit to chasten his people; yea, he trieth their patience and their faith.” — Mosiah 23:21",
  "“If ye will not nourish the word, it will not get root in you.” — Alma 32:38",
  "“The Lord is merciful unto all who will, in the sincerity of their hearts, call upon his holy name.” — Helaman 3:27",
  "“Feast upon the words of Christ; for behold, the words of Christ will tell you all things what ye should do.” — 2 Nephi 32:3",
  "“Behold, my soul delighteth in the things of the Lord.” — 2 Nephi 4:16",
  "“Counsel with the Lord in all thy doings, and he will direct thee for good.” — Alma 37:37",
  "“If ye have not charity, ye are nothing.” — Moroni 7:46",
  "“There is no other name given whereby man can be saved.” — 2 Nephi 31:21",
  "“Awake, my sons; put on the armor of righteousness.” — 2 Nephi 1:23",
  "“The natural man is an enemy to God.” — Mosiah 3:19",
  "“The Spirit of the Lord did not dwell in unholy temples.” — Helaman 4:24",
  "“Behold, I am a disciple of Jesus Christ, the Son of God.” — 3 Nephi 5:13",
  "“Wickedness never was happiness.” — Alma 41:10",
  "“The worth of souls is great in the sight of God.” — D&C 18:10 (Also reflected in Alma 26:37)",
  "“He inviteth them all to come unto him and partake of his goodness.” — 2 Nephi 26:33",
  "“They were men of a sound understanding and they had searched the scriptures diligently.” — Alma 17:2",
  "“I glory in my Jesus, for he hath redeemed my soul from hell.” — 2 Nephi 33:6",
  "“Faith is things which are hoped for and not seen; wherefore, dispute not because ye see not.” — Ether 12:6",
  "“Man was created in the image of God.” — Ether 3:15",
  "“He did speak peace to our souls, and did grant unto us great faith.” — Alma 58:11",
  "“Behold, I say unto you that the good shepherd doth call you.” — Alma 5:38",
  "“If men come unto me I will show unto them their weakness.” — Ether 12:27"
];
function loadQuote() {
  try {
    var today = new Date().toISOString().split("T")[0];
    var saved = JSON.parse(localStorage.getItem("dailyQuote") || "{}");
    if (saved.date === today) {
      document.getElementById("quote-text").innerText = saved.quote;
      return;
    }
    var q = quotes[Math.floor(Math.random() * quotes.length)];
    localStorage.setItem("dailyQuote", JSON.stringify({ date: today, quote: q }));
    document.getElementById("quote-text").innerText = q;
  } catch (e) {
    document.getElementById("quote-text").innerText = quotes[0];
  }
}

// ---------- To-Dos ----------
function loadTodos() {
  var todos = JSON.parse(localStorage.getItem("todos") || "[]");
  var done = JSON.parse(localStorage.getItem("done") || "[]");
  var list = document.getElementById("todo-list");
  var doneList = document.getElementById("done-list");
  list.innerHTML = ""; doneList.innerHTML = "";
  for (var i=0; i<todos.length; i++) {
    var li = document.createElement("li");
    li.innerHTML = "<input type='checkbox' onclick='markDone(" + i + ")'>" + todos[i].text;
    list.appendChild(li);
  }
  for (var j=0; j<done.length; j++) {
    var li2 = document.createElement("li");
    li2.innerHTML = "<input type='checkbox' checked onclick='unmarkDone(" + j + ")'>" + done[j].text;
    doneList.appendChild(li2);
  }
}
function saveTodos(todos, done) {
  localStorage.setItem("todos", JSON.stringify(todos));
  localStorage.setItem("done", JSON.stringify(done));
}
function addTodo() {
  var input = document.getElementById("new-todo");
  var val = input.value.trim();
  if (!val) return;
  var todos = JSON.parse(localStorage.getItem("todos") || "[]");
  todos.push({ text: val });
  saveTodos(todos, JSON.parse(localStorage.getItem("done") || "[]"));
  input.value = "";
  loadTodos();
}
function markDone(i) {
  var todos = JSON.parse(localStorage.getItem("todos") || "[]");
  var done = JSON.parse(localStorage.getItem("done") || "[]");
  done.push(todos[i]);
  todos.splice(i, 1);
  saveTodos(todos, done);
  loadTodos();
}
function unmarkDone(i) {
  var todos = JSON.parse(localStorage.getItem("todos") || "[]");
  var done = JSON.parse(localStorage.getItem("done") || "[]");
  todos.push(done[i]);
  done.splice(i, 1);
  saveTodos(todos, done);
  loadTodos();
}
function clearDone() {
  var todos = JSON.parse(localStorage.getItem("todos") || "[]");
  saveTodos(todos, []);
  loadTodos();
}

// ---------- Init ----------
loadCalendar();
loadWeather();
loadQuote();
loadTodos();
</script>
</body>
</html>
