<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake's Kindle Dashboard</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: Georgia, serif;
  background: #fff;
  color: #000;

  /* +25% base font */
  font-size: 28px;

  display: flex;
  justify-content: center;
}

/* Wider layout */
.wrapper {
  width: 750px; /* was 600px */
  padding: 14px;
  box-sizing: border-box;
}

.module {
  border: 1px solid #000;
  border-radius: 8px;

  /* Bigger padding */
  padding: 14px;

  margin-bottom: 16px;
}

/* Larger headers */
h2 {
  font-size: 1.5em; /* was 1.2em */
  margin: 0 0 10px 0;
  border-bottom: 1px solid #000;
  padding-bottom: 6px;
}

ul {
  margin: 0;
  padding-left: 26px;
  line-height: 1.5;
}

.small {
  font-size: 1.1em;
  color: #222;
}
</style>
</head>

<body>

<div class="wrapper">

  <!-- Calendar -->
  <div class="module" id="calendar">
    <h2>Calendar</h2>
    <ul id="calendar-list">
      <li>Loading calendar...</li>
    </ul>
  </div>

  <!-- Weather -->
  <div class="module" id="weather">
    <h2>Weather</h2>
    <div id="weather-content">Loading weather...</div>
  </div>

  <!-- Daily Quote -->
  <div class="module" id="quote">
    <h2>Daily Quote</h2>
    <p id="quote-text">Loading quote...</p>
  </div>


  <!-- ===============================
       TO-DOS (DISABLED FOR NOW)
       ===============================

  <div class="module" id="todos">
    <h2>To-Dos</h2>

    <ul id="todo-list"></ul>

    <div>
      <input id="new-todo" type="text" placeholder="Add task...">
      <button id="add-todo-btn">Add</button>
    </div>

    <div id="completed-list">
      <strong>Completed:</strong>

      <ul id="done-list"></ul>

      <button id="clear-done-btn">
        Clear Completed
      </button>
    </div>
  </div>

  =============================== -->

</div>


<script>

/* ========= SAFE, KINDLE-COMPATIBLE DASHBOARD JS (ES5 only) ========= */

/* ---------- Helpers ---------- */

function safeParseJSON(s) {
  try { return JSON.parse(s); }
  catch (e) { return null; }
}

function padHourWithZeroIfNeeded(timeStr) {
  var m = timeStr.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return timeStr;

  var hh = m[1];
  var mm = m[2];

  if (hh.length === 1) hh = '0' + hh;

  return hh + ':' + mm + timeStr.slice(m[0].length);
}


/* ---------- Calendar ---------- */

function loadCalendar() {

  try {

    var xhr = new XMLHttpRequest();

    xhr.open('GET', 'calendar.json', true);

    xhr.onreadystatechange = function () {

      if (xhr.readyState !== 4) return;

      var ul = document.getElementById('calendar-list');

      if (xhr.status === 200) {

        var events = safeParseJSON(xhr.responseText);

        if (!events || !events.length) {
          ul.innerHTML = '<li>No upcoming events</li>';
          return;
        }

        ul.innerHTML = '';

        for (var i = 0; i < events.length; i++) {

          var item = events[i];

          if (typeof item === 'string') {

            var res = item.match(/(\b\d{1,2}:\d{2}\b)/);

            var outText = item;

            if (res) {
              var rawTime = res[1];
              var padded = padHourWithZeroIfNeeded(rawTime);
              outText = item.replace(rawTime, padded);
            }

            var li = document.createElement('li');
            li.textContent = outText;
            ul.appendChild(li);
          }

          else if (item && item.date && item.summary) {

            try {

              var d = new Date(item.date);

              if (isNaN(d.getTime())) {

                var li2 = document.createElement('li');
                li2.textContent = String(item.summary || item);
                ul.appendChild(li2);

              } else {

                var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

                var mo = months[d.getMonth()];
                var day = d.getDate();

                var hh = d.getHours() % 12;
                if (hh === 0) hh = 12;

                var mm = d.getMinutes();

                var ampm = (d.getHours() >= 12) ? 'PM' : 'AM';

                var hhStr = hh < 10 ? '0' + hh : '' + hh;
                var mmStr = mm < 10 ? '0' + mm : '' + mm;

                var formatted =
                  mo + ' ' +
                  (day < 10 ? '0' + day : day) + ' ' +
                  hhStr + ':' + mmStr + ' ' + ampm;

                var li3 = document.createElement('li');
                li3.textContent = formatted + ' - ' + item.summary;
                ul.appendChild(li3);
              }

            } catch (err) {

              var li4 = document.createElement('li');
              li4.textContent = String(item.summary || item);
              ul.appendChild(li4);
            }
          }

          else {

            var li5 = document.createElement('li');
            li5.textContent = String(item);
            ul.appendChild(li5);
          }
        }

      } else {

        ul.innerHTML = '<li>Offline or calendar unavailable.</li>';
      }
    };

    xhr.timeout = 8000;

    xhr.ontimeout = function () {
      document.getElementById('calendar-list').innerHTML =
        '<li>Calendar timed out.</li>';
    };

    xhr.onerror = function () {
      document.getElementById('calendar-list').innerHTML =
        '<li>Calendar error.</li>';
    };

    xhr.send();

  } catch (e) {

    document.getElementById('calendar-list').innerHTML =
      '<li>Calendar failed.</li>';
  }
}


/* ---------- Weather ---------- */

function loadWeather() {

  try {

    var xhr = new XMLHttpRequest();

    var url =
      'https://api.open-meteo.com/v1/forecast?' +
      'latitude=33.285&longitude=-96.5717&' +
      'current_weather=true&' +
      'temperature_unit=fahrenheit&' +
      'windspeed_unit=mph&timezone=auto';

    xhr.open('GET', url, true);

    xhr.onreadystatechange = function () {

      if (xhr.readyState !== 4) return;

      var el = document.getElementById('weather-content');

      if (xhr.status === 200) {

        var data = safeParseJSON(xhr.responseText);

        if (data && data.current_weather) {

          var cur = data.current_weather;

          el.textContent =
            'Now: ' +
            Math.round(cur.temperature) +
            '°F, ' +
            Math.round(cur.windspeed) +
            ' mph';

        } else {

          el.textContent = 'Weather unavailable.';
        }

      } else {

        el.textContent = 'Weather unavailable.';
      }
    };

    xhr.timeout = 8000;

    xhr.ontimeout = function () {
      document.getElementById('weather-content').textContent =
        'Weather timed out.';
    };

    xhr.onerror = function () {
      document.getElementById('weather-content').textContent =
        'Weather error.';
    };

    xhr.send();

  } catch (e) {

    document.getElementById('weather-content').textContent =
      'Weather failed.';
  }
}


/* ---------- Quotes ---------- */

var quotes = [
  "I will go and do the things which the Lord hath commanded. — 1 Nephi 3:7",
  "Press forward with a steadfastness in Christ. — 2 Nephi 31:20",
  "Charity is the pure love of Christ. — Moroni 7:47",
  "By small and simple things are great things brought to pass. — Alma 37:6",
  "Hold fast to the iron rod. — 1 Nephi 8:30",
  "When ye are in the service of your fellow beings ye are only in the service of your God. — Mosiah 2:17"
];

function displayDailyQuote() {

  try {

    var today =
      (new Date()).toISOString().split('T')[0];

    var saved =
      safeParseJSON(localStorage.getItem('dailyQuote') || '{}') || {};

    if (saved.date === today && saved.quote) {

      document.getElementById('quote-text').innerText =
        saved.quote;

      return;
    }

    var idx =
      Math.floor(Math.random() * quotes.length);

    var q = quotes[idx];

    try {
      localStorage.setItem(
        'dailyQuote',
        JSON.stringify({ date: today, quote: q })
      );
    } catch (e) {}

    document.getElementById('quote-text').innerText = q;

  } catch (e) {

    document.getElementById('quote-text').innerText =
      quotes[0];
  }
}


/* ---------- Init ---------- */

displayDailyQuote();
loadCalendar();
loadWeather();

</script>

</body>
</html>
