<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake's Dashboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      color: #000;
      font-family: "Georgia", serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* wrapper gets rotated */
    .rotated {
      transform: rotate(90deg);
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vh;
      height: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      gap: 4px;
      padding: 6px;
    }

    .module {
      border: 2px solid black;
      padding: 14px;
      box-sizing: border-box;
      overflow: hidden;
      border-radius: 6px;
    }

    h2 {
      margin-top: 0;
      font-size: 1.4em;
      border-bottom: 2px solid #000;
      padding-bottom: 6px;
      margin-bottom: 8px;
      text-align: left;
    }

    ul {
      padding-left: 24px;
      margin-top: 0.5em;
      font-size: 1.2em;
      line-height: 1.4;
    }

    p, li, div {
      font-size: 1.2em;
    }

    #todos input[type="checkbox"] {
      transform: scale(1.3);
      margin-right: 8px;
    }

    input#new-todo {
      font-size: 1.1em;
      padding: 4px;
      margin-top: 6px;
      border: 1px solid #333;
      width: 90%;
    }

    .weather-line {
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="rotated">
    <div class="grid">
      <!-- Calendar -->
      <div class="module" id="calendar">
        <h2>📅 Calendar</h2>
        <ul>
          <li>Oct 29 – Grocery pickup</li>
          <li>Oct 30 – Dinner w/ family</li>
          <li>Oct 31 – Trick or treat 🎃</li>
          <li>Nov 1 – Church activity</li>
        </ul>
      </div>

      <!-- Weather -->
      <div class="module" id="weather">
        <h2>🌤 Weather (Melissa, TX)</h2>
        <div id="weather-content">Loading weather...</div>
      </div>

      <!-- Daily Quote -->
      <div class="module" id="quote">
        <h2>💬 Daily Quote</h2>
        <p id="quote-text">“Placeholder quote — soon this will pull daily inspiration automatically.”</p>
      </div>

      <!-- To-Dos -->
      <div class="module" id="todos">
        <h2>✅ To-Dos</h2>
        <ul id="todo-list"></ul>
        <input id="new-todo" type="text" placeholder="Add new task...">
      </div>
    </div>
  </div>

  <script>
    // --- Weather (Open-Meteo, no API key) ---
    async function updateWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=33.285&longitude=-96.5717&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph");
        const data = await res.json();
        const w = data.current_weather;
        document.getElementById("weather-content").innerHTML = `
          <div class='weather-line'>Temp: ${w.temperature}°F</div>
          <div class='weather-line'>Wind: ${w.windspeed} mph</div>
          <div class='weather-line'>Conditions: ${w.weathercode || "Clear"}</div>
        `;
      } catch (e) {
        document.getElementById("weather-content").innerText = "Unable to load weather.";
      }
    }
    updateWeather();

    // --- To-Dos (saved in localStorage) ---
    const list = document.getElementById("todo-list");
    const input = document.getElementById("new-todo");

    function loadTodos() {
      const todos = JSON.parse(localStorage.getItem("todos") || "[]");
      list.innerHTML = "";
      todos.forEach((t, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<input type='checkbox' ${t.done ? "checked" : ""} data-idx='${i}'>${t.text}`;
        list.appendChild(li);
      });
    }

    function saveTodos() {
      const todos = [];
      list.querySelectorAll("li").forEach(li => {
        const cb = li.querySelector("input");
        todos.push({ text: cb.nextSibling.textContent, done: cb.checked });
      });
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    list.addEventListener("change", saveTodos);

    input.addEventListener("keypress", e => {
      if (e.key === "Enter" && input.value.trim() !== "") {
        const todos = JSON.parse(localStorage.getItem("todos") || "[]");
        todos.push({ text: input.value.trim(), done: false });
        localStorage.setItem("todos", JSON.stringify(todos));
        input.value = "";
        loadTodos();
      }
    });

    loadTodos();
  </script>
</body>
</html>
