<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake's Kindle Dashboard</title>
<style>
html, body {
  margin: 0; padding: 0;
  font-family: Georgia, serif;
  background: #fff; color: #000;
  font-size: 20px;
  display: flex; justify-content: center;
}
.wrapper {
  width: 600px;
  padding: 10px;
  box-sizing: border-box;
}
.module {
  border: 1px solid #000;
  border-radius: 6px;
  padding: 10px;
  margin-bottom: 12px;
}
h2 {
  font-size: 1.15em;
  margin: 0 0 8px 0;
  border-bottom: 1px solid #000;
  padding-bottom: 4px;
}
ul { margin: 0; padding-left: 20px; line-height: 1.4; }
.weather-line { margin: 4px 0; }
#todos input[type="checkbox"] { margin-right: 6px; }
#new-todo { width: 70%; font-size: 1em; }
button { font-size: 1em; padding: 4px 8px; margin-left: 4px; }
#completed-list { border-top: 1px solid #888; margin-top: 10px; padding-top: 6px; }
</style>
</head>
<body>

<div class="wrapper">
  <div class="module" id="calendar">
    <h2>Calendar</h2>
    <ul id="calendar-list"><li>Loading calendar...</li></ul>
  </div>

  <div class="module" id="weather">
    <h2>Weather</h2>
    <div id="weather-content">Loading weather...</div>
  </div>

  <div class="module" id="quote">
    <h2>Daily Quote</h2>
    <p id="quote-text">Loading quote...</p>
  </div>

  <div class="module" id="todos">
    <h2>To-Dos</h2>
    <ul id="todo-list"></ul>
    <div>
      <input id="new-todo" type="text" placeholder="Add task...">
      <button onclick="addTodo()">Add</button>
    </div>
    <div id="completed-list">
      <strong>Completed:</strong>
      <ul id="done-list"></ul>
      <button onclick="clearDone()">Clear Completed</button>
    </div>
  </div>
</div>

<script>
// ---------- Calendar ----------
function loadCalendar() {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "calendar.json", true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      var ul = document.getElementById("calendar-list");
      if (xhr.status === 200) {
        try {
          var events = JSON.parse(xhr.responseText);
          ul.innerHTML = "";
          if (!events.length) {
            ul.innerHTML = "<li>No upcoming events</li>";
            return;
          }
          for (var i=0; i<events.length; i++) {
            var e = events[i];
            var d = new Date(e.date);
            var dateStr = formatDate(d);
            var li = document.createElement("li");
            li.textContent = dateStr + " – " + e.summary;
            ul.appendChild(li);
          }
        } catch (e) {
          ul.innerHTML = "<li>Calendar format error.</li>";
        }
      } else {
        ul.innerHTML = "<li>Offline or calendar unavailable.</li>";
      }
    }
  };
  xhr.send();
}

function formatDate(d) {
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var month = months[d.getMonth()];
  var day = d.getDate();
  var hours = d.getHours();
  var minutes = d.getMinutes();
  var ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12;
  if (hours === 0) hours = 12;
  if (minutes < 10) minutes = "0" + minutes;
  return month + " " + day + " " + hours + ":" + minutes + " " + ampm;
}

// ---------- Weather ----------
function loadWeather() {
  var xhr = new XMLHttpRequest();
  var url = "https://api.open-meteo.com/v1/forecast?latitude=33.285&longitude=-96.5717&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto";
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      var div = document.getElementById("weather-content");
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          var t = Math.round(data.current_weather.temperature);
          var w = Math.round(data.current_weather.windspeed);
          div.innerHTML = "Now: " + t + "°F, " + w + " mph wind";
        } catch (e) {
          div.innerText = "Weather parse error.";
        }
      } else {
        div.innerText = "Offline.";
      }
    }
  };
  xhr.send();
}

// ---------- Daily Quote ----------
var quotes = [
  "“Do what you can, with what you have, where you are.” — Theodore Roosevelt",
  "“In the middle of difficulty lies opportunity.” — Albert Einstein",
  "“Success is not final, failure is not fatal: It is the courage to continue that counts.” — Winston Churchill",
  "“Keep your face always toward the sunshine—and shadows will fall behind you.” — Walt Whitman",
  "“The best way out is always through.” — Robert Frost"
];
function loadQuote() {
  try {
    var today = new Date().toISOString().split("T")[0];
    var saved = JSON.parse(localStorage.getItem("dailyQuote") || "{}");
    if (saved.date === today) {
      document.getElementById("quote-text").innerText = saved.quote;
      return;
    }
    var q = quotes[Math.floor(Math.random() * quotes.length)];
    localStorage.setItem("dailyQuote", JSON.stringify({ date: today, quote: q }));
    document.getElementById("quote-text").innerText = q;
  } catch (e) {
    document.getElementById("quote-text").innerText = quotes[0];
  }
}

// ---------- To-Dos ----------
function loadTodos() {
  var todos = JSON.parse(localStorage.getItem("todos") || "[]");
  var done = JSON.parse(localStorage.getItem("done") || "[]");
  var list = document.getElementById("todo-list");
  var doneList = document.getElementById("done-list");
  list.innerHTML = ""; doneList.innerHTML = "";
  for (var i=0; i<todos.length; i++) {
    var li = document.createElement("li");
    li.innerHTML = "<input type='checkbox' onclick='markDone(" + i + ")'>" + todos[i].text;
    list.appendChild(li);
  }
  for (var j=0; j<done.length; j++) {
    var li2 = document.createElement("li");
    li2.innerHTML = "<input type='checkbox' checked onclick='unmarkDone(" + j + ")'>" + done[j].text;
    doneList.appendChild(li2);
  }
}
function saveTodos(todos, done) {
  localStorage.setItem("todos", JSON.stringify(todos));
  localStorage.setItem("done", JSON.stringify(done));
}
function addTodo() {
  var input = document.getElementById("new-todo");
  var val = input.value.trim();
  if (!val) return;
  var todos = JSON.parse(localStorage.getItem("todos") || "[]");
  todos.push({ text: val });
  saveTodos(todos, JSON.parse(localStorage.getItem("done") || "[]"));
  input.value = "";
  loadTodos();
}
function markDone(i) {
  var todos = JSON.parse(localStorage.getItem("todos") || "[]");
  var done = JSON.parse(localStorage.getItem("done") || "[]");
  done.push(todos[i]);
  todos.splice(i, 1);
  saveTodos(todos, done);
  loadTodos();
}
function unmarkDone(i) {
  var todos = JSON.parse(localStorage.getItem("todos") || "[]");
  var done = JSON.parse(localStorage.getItem("done") || "[]");
  todos.push(done[i]);
  done.splice(i, 1);
  saveTodos(todos, done);
  loadTodos();
}
function clearDone() {
  var todos = JSON.parse(localStorage.getItem("todos") || "[]");
  saveTodos(todos, []);
  loadTodos();
}

// ---------- Init ----------
loadCalendar();
loadWeather();
loadQuote();
loadTodos();
</script>
</body>
</html>
