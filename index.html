<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake's Dashboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      color: #000;
      font-family: "Georgia", serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-size: 14px;
    }

    /* Layout that adapts to Kindle orientation */
    .wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      width: 100%;
      height: 100%;
      padding: 6px;
      box-sizing: border-box;
    }

    @media screen and (min-aspect-ratio: 1/1) {
      /* Landscape mode: 4 columns */
      .wrapper {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 1fr;
      }
    }

    .module {
      border: 1px solid black;
      padding: 10px;
      border-radius: 4px;
      box-sizing: border-box;
      overflow: hidden;
    }

    h2 {
      margin: 0 0 4px 0;
      font-size: 1.1em;
      border-bottom: 1px solid #000;
      padding-bottom: 4px;
    }

    ul {
      padding-left: 18px;
      margin: 0;
      font-size: 1em;
      line-height: 1.3;
    }

    p, li, div {
      font-size: 1em;
    }

    #todos input[type="checkbox"] {
      transform: scale(1.1);
      margin-right: 6px;
    }

    input#new-todo {
      font-size: 1em;
      padding: 3px;
      margin-top: 4px;
      border: 1px solid #333;
      width: 70%;
    }

    button {
      font-size: 1em;
      padding: 3px 6px;
      margin-left: 4px;
    }

    #completed-list {
      margin-top: 10px;
      border-top: 1px solid #888;
      padding-top: 5px;
      font-size: 0.95em;
    }

    .weather-line { margin: 3px 0; }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Calendar -->
    <div class="module" id="calendar">
      <h2>📅 Calendar</h2>
      <ul>
        <li>Oct 29 – Grocery pickup</li>
        <li>Oct 30 – Dinner w/ family</li>
        <li>Oct 31 – Trick or Treat</li>
        <li>Nov 1 – Church activity</li>
      </ul>
    </div>

    <!-- Weather -->
    <div class="module" id="weather">
      <h2>🌤 Weather (Melissa, TX)</h2>
      <div id="weather-content">Loading weather...</div>
    </div>

    <!-- Daily Quote -->
    <div class="module" id="quote">
      <h2>💬 Daily Quote</h2>
      <p id="quote-text">“Do what you can, with what you have, where you are.” — Theodore Roosevelt</p>
    </div>

    <!-- To-Dos -->
    <div class="module" id="todos">
      <h2>✅ To-Dos</h2>
      <ul id="todo-list"></ul>
      <div>
        <input id="new-todo" type="text" placeholder="Add task...">
        <button id="add-todo">Add</button>
      </div>
      <div id="completed-list">
        <strong>Completed:</strong>
        <ul id="done-list"></ul>
        <button id="clear-done">Clear Completed</button>
      </div>
    </div>
  </div>

  <script>
    // --- Weather (Kindle-friendly) ---
    function updateWeather() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "https://wttr.in/Melissa,Texas?format=3");
      xhr.onload = function() {
        if (xhr.status === 200) {
          document.getElementById("weather-content").innerText = xhr.responseText;
        } else {
          document.getElementById("weather-content").innerText = "No data.";
        }
      };
      xhr.onerror = function() {
        document.getElementById("weather-content").innerText = "Offline.";
      };
      xhr.send();
    }
    updateWeather();

    // --- To-Dos ---
    var list = document.getElementById("todo-list");
    var doneList = document.getElementById("done-list");
    var input = document.getElementById("new-todo");
    var addBtn = document.getElementById("add-todo");
    var clearBtn = document.getElementById("clear-done");

    function loadTodos() {
      var todos = JSON.parse(localStorage.getItem("todos") || "[]");
      var done = JSON.parse(localStorage.getItem("done") || "[]");
      list.innerHTML = "";
      doneList.innerHTML = "";

      todos.forEach((t, i) => {
        var li = document.createElement("li");
        li.innerHTML = "<input type='checkbox' data-idx='" + i + "'>" + t.text;
        list.appendChild(li);
      });

      done.forEach((t, i) => {
        var li = document.createElement("li");
        li.innerHTML = "<input type='checkbox' checked data-idx='" + i + "'>" + t.text;
        doneList.appendChild(li);
      });
    }

    function saveTodos() {
      var todos = [];
      var done = [];
      list.querySelectorAll("li").forEach(li => {
        var cb = li.querySelector("input");
        todos.push({ text: cb.nextSibling.textContent, done: false });
      });
      doneList.querySelectorAll("li").forEach(li => {
        var cb = li.querySelector("input");
        done.push({ text: cb.nextSibling.textContent, done: true });
      });
      localStorage.setItem("todos", JSON.stringify(todos));
      localStorage.setItem("done", JSON.stringify(done));
    }

    function addTodo() {
      if (input.value.trim() === "") return;
      var todos = JSON.parse(localStorage.getItem("todos") || "[]");
      todos.push({ text: input.value.trim(), done: false });
      localStorage.setItem("todos", JSON.stringify(todos));
      input.value = "";
      loadTodos();
    }

    list.addEventListener("change", e => {
      if (e.target.checked) {
        var todos = JSON.parse(localStorage.getItem("todos") || "[]");
        var done = JSON.parse(localStorage.getItem("done") || "[]");
        var idx = e.target.dataset.idx;
        done.push(todos[idx]);
        todos.splice(idx, 1);
        localStorage.setItem("todos", JSON.stringify(todos));
        localStorage.setItem("done", JSON.stringify(done));
        loadTodos();
      }
    });

    clearBtn.onclick = function() {
      localStorage.setItem("done", JSON.stringify([]));
      loadTodos();
    };

    addBtn.onclick = addTodo;
    input.onchange = addTodo;

    loadTodos();
  </script>
</body>
</html>
