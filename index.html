<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake's Kindle Dashboard</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  font-family: Georgia, serif;
  background: #fff;
  color: #000;
  font-size: 28px; /* was 22px */
  display: flex;
  justify-content: center;
}

.wrapper {
  width: 600px; /* unchanged */
  padding: 10px;
  box-sizing: border-box;
}

.module {
  border: 1px solid #000;
  border-radius: 6px;
  padding: 10px; /* unchanged */
  margin-bottom: 12px; /* unchanged */
}

h2 {
  font-size: 1.5em; /* was 1.2em */
  margin: 0 0 8px 0;
  border-bottom: 1px solid #000;
  padding-bottom: 4px;
}

ul {
  margin: 0;
  padding-left: 20px;
  line-height: 1.6; /* was 1.4 */
}

#todos input[type="checkbox"] {
  margin-right: 6px;
  transform: scale(1.2);
}

#new-todo {
  width: 70%;
  font-size: 1em;
}

button {
  font-size: 1em;
  padding: 4px 8px;
  margin-left: 4px;
}

#completed-list {
  border-top: 1px solid #888;
  margin-top: 10px;
  padding-top: 6px;
}

.small {
  font-size: 0.95em;
  color: #222;
}

#quote-text {
  margin: 4px 0 0 0;
}
  
</style>
</head>

<body>

<div class="wrapper">

  <div class="module" id="calendar">
    <h2>Calendar</h2>
    <ul id="calendar-list"><li>Loading calendar...</li></ul>
  </div>

  <div class="module" id="weather">
    <h2>Weather</h2>
    <div id="weather-content">Loading weather...</div>
  </div>

  <div class="module" id="quote">
    <h2>Daily Quote</h2>
    <p id="quote-text">Loading quote...</p>
  </div>

  <div class="module" id="todos">
    <h2>To-Dos</h2>

    <ul id="todo-list"></ul>

    <div>
      <input id="new-todo" type="text" placeholder="Add task...">
      <button id="add-todo-btn">Add</button>
    </div>

    <div id="completed-list">
      <strong>Completed:</strong>
      <ul id="done-list"></ul>
      <button id="clear-done-btn">Clear Completed</button>
    </div>
  </div>

</div>


<script>

/* ========= SAFE, KINDLE-COMPATIBLE DASHBOARD JS (ES5 only) ========= */

/* ---------- Helpers ---------- */

function safeParseJSON(s) {
  try { return JSON.parse(s); } catch (e) { return null; }
}

function padHourWithZeroIfNeeded(timeStr) {
  var m = timeStr.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return timeStr;
  var hh = m[1];
  var mm = m[2];
  if (hh.length === 1) hh = '0' + hh;
  return hh + ':' + mm + timeStr.slice(m[0].length);
}


/* ---------- Calendar ---------- */

function loadCalendar() {

  try {

    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'calendar.json', true);

    xhr.onreadystatechange = function () {

      if (xhr.readyState !== 4) return;

      var ul = document.getElementById('calendar-list');

      if (xhr.status === 200) {

        var events = safeParseJSON(xhr.responseText);

        if (!events || !events.length) {
          ul.innerHTML = '<li>No upcoming events</li>';
          return;
        }

        ul.innerHTML = '';

        for (var i = 0; i < events.length; i++) {

          var item = events[i];

          if (typeof item === 'string') {

            var res = item.match(/(\b\d{1,2}:\d{2}\b)/);

            var outText = item;

            if (res) {

              var rawTime = res[1];
              var padded = padHourWithZeroIfNeeded(rawTime);
              outText = item.replace(rawTime, padded);
            }

            var li = document.createElement('li');
            li.textContent = outText;
            ul.appendChild(li);
          }

          else {

            var li2 = document.createElement('li');
            li2.textContent = String(item);
            ul.appendChild(li2);
          }
        }

      } else {
        ul.innerHTML = '<li>Offline or calendar unavailable.</li>';
      }
    };

    xhr.timeout = 8000;

    xhr.ontimeout = function () {
      document.getElementById('calendar-list')
        .innerHTML = '<li>Calendar request timed out.</li>';
    };

    xhr.onerror = function () {
      document.getElementById('calendar-list')
        .innerHTML = '<li>Error loading calendar.</li>';
    };

    xhr.send();

  } catch (e) {

    document.getElementById('calendar-list')
      .innerHTML = '<li>Calendar load failed.</li>';
  }
}


/* ---------- Weather ---------- */

function loadWeather() {

  try {

    var xhr = new XMLHttpRequest();

    var url =
      'https://api.open-meteo.com/v1/forecast?latitude=33.285&longitude=-96.5717&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto';

    xhr.open('GET', url, true);

    xhr.onreadystatechange = function () {

      if (xhr.readyState !== 4) return;

      var el = document.getElementById('weather-content');

      if (xhr.status === 200) {

        var data = safeParseJSON(xhr.responseText);

        if (data && data.current_weather) {

          var cur = data.current_weather;

          el.textContent =
            'Now: ' +
            Math.round(cur.temperature) +
            '°F, ' +
            Math.round(cur.windspeed) +
            ' mph';

        } else {
          el.textContent = 'Weather unavailable.';
        }

      } else {
        el.textContent = 'Weather unavailable.';
      }
    };

    xhr.timeout = 8000;

    xhr.ontimeout = function () {
      document.getElementById('weather-content')
        .textContent = 'Weather timed out.';
    };

    xhr.onerror = function () {
      document.getElementById('weather-content')
        .textContent = 'Weather error.';
    };

    xhr.send();

  } catch (e) {

    document.getElementById('weather-content')
      .textContent = 'Weather failed.';
  }
}


/* ---------- Quotes ---------- */

var quotes = [
  "I will go and do the things which the Lord hath commanded. — 1 Nephi 3:7",
  "Adam fell that men might be; and men are, that they might have joy. — 2 Nephi 2:25",
  "Press forward with a steadfastness in Christ. — 2 Nephi 31:20",
  "Charity is the pure love of Christ. — Moroni 7:47",
  "By small and simple things are great things brought to pass. — Alma 37:6",
  "Trust in the Lord forever. — 2 Nephi 4:34",
  "Feast upon the words of Christ. — 2 Nephi 32:3",
  "Come unto Christ, and be perfected in him. — Moroni 10:32",
  "Hold fast to the iron rod. — 1 Nephi 8:30",
  "When ye are in the service of your fellow beings ye are only in the service of your God. — Mosiah 2:17"
];

function displayDailyQuote() {

  try {

    var todayKey =
      (new Date()).toISOString().split('T')[0];

    var saved =
      safeParseJSON(localStorage.getItem('dailyQuote') || '{}') || {};

    if (saved.date === todayKey && saved.quote) {

      document.getElementById('quote-text')
        .innerText = saved.quote;

      return;
    }

    var idx = Math.floor(Math.random() * quotes.length);
    var q = quotes[idx];

    try {
      localStorage.setItem(
        'dailyQuote',
        JSON.stringify({ date: todayKey, quote: q })
      );
    } catch (e) {}

    document.getElementById('quote-text')
      .innerText = q;

  } catch (e) {

    document.getElementById('quote-text')
      .innerText = quotes[0];
  }
}


/* ---------- Todos ---------- */

function loadTodos() {

  try {

    var todos =
      safeParseJSON(localStorage.getItem('todos') || '[]') || [];

    var done =
      safeParseJSON(localStorage.getItem('done') || '[]') || [];

    var list = document.getElementById('todo-list');
    var doneList = document.getElementById('done-list');

    list.innerHTML = '';
    doneList.innerHTML = '';

    for (var i = 0; i < todos.length; i++) {

      var li = document.createElement('li');

      li.innerHTML =
        '<input type="checkbox" onclick="markDoneIndex(' + i + ')"> ' +
        (todos[i].text || '');

      list.appendChild(li);
    }

    for (var j = 0; j < done.length; j++) {

      var li2 = document.createElement('li');

      li2.innerHTML =
        '<input type="checkbox" checked onclick="unmarkDoneIndex(' + j + ')"> ' +
        (done[j].text || '');

      doneList.appendChild(li2);
    }

  } catch (e) {}
}


function saveTodos(todos, done) {

  try {

    localStorage.setItem('todos', JSON.stringify(todos));
    localStorage.setItem('done', JSON.stringify(done));

  } catch (e) {}
}


function addTodo() {

  try {

    var input = document.getElementById('new-todo');

    var val = input.value.replace(/^\s+|\s+$/g, '');

    if (!val) return;

    var todos =
      safeParseJSON(localStorage.getItem('todos') || '[]') || [];

    todos.push({ text: val });

    saveTodos(
      todos,
      safeParseJSON(localStorage.getItem('done') || '[]') || []
    );

    input.value = '';

    loadTodos();

  } catch (e) {}
}


function markDoneIndex(i) {

  try {

    var todos =
      safeParseJSON(localStorage.getItem('todos') || '[]') || [];

    var done =
      safeParseJSON(localStorage.getItem('done') || '[]') || [];

    if (i >= 0 && i < todos.length) {

      done.push(todos[i]);
      todos.splice(i, 1);

      saveTodos(todos, done);
      loadTodos();
    }

  } catch (e) {}
}


function unmarkDoneIndex(i) {

  try {

    var todos =
      safeParseJSON(localStorage.getItem('todos') || '[]') || [];

    var done =
      safeParseJSON(localStorage.getItem('done') || '[]') || [];

    if (i >= 0 && i < done.length) {

      todos.push(done[i]);
      done.splice(i, 1);

      saveTodos(todos, done);
      loadTodos();
    }

  } catch (e) {}
}


function clearDone() {

  try {

    var todos =
      safeParseJSON(localStorage.getItem('todos') || '[]') || [];

    saveTodos(todos, []);
    loadTodos();

  } catch (e) {}
}


/* ---------- Init ---------- */

displayDailyQuote();
loadCalendar();
loadWeather();
loadTodos();

</script>

</body>
</html>
