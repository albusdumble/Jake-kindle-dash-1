<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake's Kindle Dashboard</title>
<style>
  body {
    margin:0; padding:0;
    font-family: Georgia, serif;
    font-size:20px;
    max-width:600px;
    background:#fff;
    color:#000;
  }
  .module {
    border:1px solid black;
    padding:10px;
    margin-bottom:10px;
    border-radius:4px;
    overflow:hidden;
  }
  h2 {
    font-size:85%;
    margin:0 0 5px 0;
    border-bottom:1px solid #000;
    padding-bottom:3px;
  }
  ul { padding-left:18px; margin:0; }
  input, button { font-size:1em; }
  #todos input[type="checkbox"] { transform:scale(1.1); margin-right:6px; }
  #completed-list { margin-top:10px; border-top:1px solid #888; padding-top:5px; font-size:0.95em; }
  .weather-line { margin:3px 0; display:flex; align-items:center; }
  .weather-line svg { width:24px; height:24px; margin-right:5px; }
</style>
</head>
<body>

<!-- Calendar -->
<div class="module" id="calendar">
  <h2>Calendar</h2>
  <ul id="calendar-list"><li>Loading...</li></ul>
</div>

<!-- Weather -->
<div class="module" id="weather">
  <h2>Weather</h2>
  <div id="weather-content">Loading weather...</div>
</div>

<!-- Daily Quote -->
<div class="module" id="quote">
  <h2>Daily Quote</h2>
  <p id="quote-text">“Do what you can, with what you have, where you are.” — Theodore Roosevelt</p>
</div>

<!-- To-Dos -->
<div class="module" id="todos">
  <h2>To-Dos</h2>
  <ul id="todo-list"></ul>
  <div>
    <input id="new-todo" type="text" placeholder="Add task...">
    <button onclick="addTodo()">Add</button>
  </div>
  <div id="completed-list">
    <strong>Completed:</strong>
    <ul id="done-list"></ul>
    <button onclick="clearDone()">Clear Completed</button>
  </div>
</div>

<script>
// ====== Calendar Parser ======
const icsUrl = "https://p157-caldav.icloud.com/published/2/MjAzMDk4MjAyNTcyMDMwOWelqCDmoGrZl0HbDRwh4THxwVTjex_ugi0QuWfxMzqeyjBGGFltleGeYl57ChEM7SaryzOAF7EjZcsTepi0Pwg";
const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(icsUrl);

function fetchCalendar(){
  const xhr = new XMLHttpRequest();
  xhr.open("GET", proxyUrl);
  xhr.onload = function(){
    if(xhr.status===200){
      try {
        const icsText = JSON.parse(xhr.responseText).contents;
        parseICS(icsText);
      } catch(e){
        console.error("Error parsing ICS response:",e);
        document.getElementById("calendar-list").innerHTML="<li>Error loading calendar</li>";
      }
    } else {
      document.getElementById("calendar-list").innerHTML="<li>No data.</li>";
    }
  };
  xhr.onerror = function(){
    document.getElementById("calendar-list").innerHTML="<li>Offline.</li>";
  };
  xhr.send();
}

function parseICS(icsText){
  const events=[];
  const unfolded = icsText.replace(/\r?\n /g,''); // unfold continuation lines
  const lines = unfolded.split(/\r?\n/);
  let currentEvent={};
  lines.forEach(line=>{
    if(line.startsWith("BEGIN:VEVENT")) currentEvent={};
    if(line.startsWith("SUMMARY:")) currentEvent.summary = line.replace("SUMMARY:","");
    if(line.startsWith("DTSTART")){
      const tzMatch = line.match(/DTSTART(?:;TZID=[^:]+)?:([0-9T]+Z?)/);
      if(tzMatch){
        let dStr = tzMatch[1];
        if(dStr.endsWith("Z")){
          currentEvent.date = new Date(dStr);
        } else {
          // treat as local time
          const y=dStr.slice(0,4), m=dStr.slice(4,6)-1, day=dStr.slice(6,8);
          const h=dStr.slice(9,11)||0, min=dStr.slice(11,13)||0;
          currentEvent.date=new Date(y,m,day,h,min);
        }
      }
    }
    if(line.startsWith("END:VEVENT") && currentEvent.summary && currentEvent.date){
      events.push(currentEvent);
    }
  });

  // sort ascending
  events.sort((a,b)=>a.date-b.date);
  displayNextEvents(events,4);
}

function displayNextEvents(events,count){
  const now = new Date();
  const upcoming = events.filter(e=>e.date>=now).slice(0,count);
  const ul = document.getElementById("calendar-list");
  ul.innerHTML="";
  if(upcoming.length===0){ ul.innerHTML="<li>No upcoming events</li>"; return; }
  upcoming.forEach(ev=>{
    const li=document.createElement("li");
    li.textContent = ev.date.toLocaleString() + " – " + ev.summary;
    ul.appendChild(li);
  });
}

fetchCalendar();

// ====== Weather ======
function updateWeather(){
  const xhr=new XMLHttpRequest();
  xhr.open("GET","https://api.open-meteo.com/v1/forecast?latitude=33.285&longitude=-96.5717&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph&daily=temperature_2m_max,precipitation_sum");
  xhr.onload=function(){
    if(xhr.status===200){
      try{
        const data=JSON.parse(xhr.responseText);
        const w=data.current_weather;
        const tomorrowMax=data.daily.temperature_2m_max[1];
        const rain=data.daily.precipitation_sum[1];
        const temp=Math.round(w.temperature);
        const wind=Math.round(w.windspeed);
        document.getElementById("weather-content").innerHTML=`
          <div class="weather-line">
            <svg viewBox="0 0 96 96">
              <path d="M62.142,35.858c0.512,0,1.024-0.195,1.414-0.586l2.829-2.829c0.781-0.781,0.781-2.047,0-2.828
		c-0.781-0.781-2.048-0.781-2.828,0l-2.829,2.829c-0.781,0.781-0.781,2.047,0,2.828C61.118,35.663,61.63,35.858,62.142,35.858z
		 M30,48c0-1.104-0.896-2-2-2h-4c-1.104,0-2,0.896-2,2s0.896,2,2,2h4C29.104,50,30,49.104,30,48z M32.444,60.728l-2.829,2.829
		c-0.781,0.781-0.781,2.047,0,2.828c0.39,0.391,0.902,0.586,1.414,0.586c0.512,0,1.024-0.195,1.414-0.586l2.829-2.829
		c0.781-0.781,0.781-2.047,0-2.828C34.492,59.947,33.224,59.947,32.444,60.728z M32.444,35.272c0.39,0.391,0.902,0.586,1.414,0.586
		s1.024-0.195,1.414-0.586c0.781-0.781,0.781-2.047,0-2.828l-2.829-2.829c-0.78-0.781-2.048-0.781-2.828,0
		c-0.781,0.781-0.781,2.047,0,2.828L32.444,35.272z M48,30c1.104,0,2-0.896,2-2v-4c0-1.104-0.896-2-2-2s-2,0.896-2,2v4
		C46,29.104,46.896,30,48,30z M72,46h-4c-1.104,0-2,0.896-2,2s0.896,2,2,2h4c1.104,0,2-0.896,2-2S73.104,46,72,46z M63.556,60.728
		c-0.78-0.781-2.048-0.781-2.828,0c-0.781,0.781-0.781,2.047,0,2.828l2.829,2.829c0.39,0.391,0.902,0.586,1.414,0.586
		c0.512,0,1.023-0.195,1.414-0.586c0.781-0.781,0.781-2.047,0-2.828L63.556,60.728z M48,66c-1.104,0-2,0.896-2,2v4
		c0,1.104,0.896,2,2,2s2-0.896,2-2v-4C50,66.896,49.104,66,48,66z M48,34c-7.72,0-14,6.28-14,14s6.28,14,14,14s14-6.28,14-14
		S55.72,34,48,34z M48,58c-5.514,0-10-4.486-10-10s4.486-10,10-10s10,4.486,10,10S53.514,58,48,58z"/>
            </svg>
            Now: ${temp}°F, ${wind} mph wind
          </div>
          <div class="weather-line">
            Forecast tomorrow: ${Math.round(tomorrowMax)}°F max, ${rain}mm rain
          </div>
        `;
      } catch(e){ document.getElementById("weather-content").innerText="Error parsing weather"; }
    } else { document.getElementById("weather-content").innerText="No data."; }
  };
  xhr.onerror=function(){ document.getElementById("weather-content").innerText="Offline."; };
  xhr.send();
}
updateWeather();

// ====== To-Dos ======
function loadTodos(){
  const todos=JSON.parse(localStorage.getItem("todos")||"[]");
  const done=JSON.parse(localStorage.getItem("done")||"[]");
  const list=document.getElementById("todo-list");
  const doneList=document.getElementById("done-list");
  list.innerHTML=""; doneList.innerHTML="";
  todos.forEach((t,i)=>{
    const li=document.createElement("li");
    li.innerHTML="<input type='checkbox' data-idx='"+i+"' onclick='markDone(this)'>"+t.text;
    list.appendChild(li);
  });
  done.forEach((t,i)=>{
    const li=document.createElement("li");
    li.innerHTML="<input type='checkbox' checked data-idx='"+i+"' onclick='unmarkDone(this)'>"+t.text;
    doneList.appendChild(li);
  });
}
function saveTodos(todos,done){ localStorage.setItem("todos",JSON.stringify(todos)); localStorage.setItem("done",JSON.stringify(done)); }
function addTodo(){
  const input=document.getElementById("new-todo");
  const val=input.value.trim();
  if(!val) return;
  const todos=JSON.parse(localStorage.getItem("todos")||"[]");
  todos.push({text:val});
  localStorage.setItem("todos",JSON.stringify(todos));
  input.value="";
  loadTodos();
}
function markDone(cb){
  const idx=parseInt(cb.getAttribute("data-idx"));
  const todos=JSON.parse(localStorage.getItem("todos")||"[]");
  const done=JSON.parse(localStorage.getItem("done")||"[]");
  done.push(todos[idx]); todos.splice(idx,1);
  saveTodos(todos,done); loadTodos();
}
function unmarkDone(cb){
  const idx=parseInt(cb.getAttribute("data-idx"));
  const todos=JSON.parse(localStorage.getItem("todos")||"[]");
  const done=JSON.parse(localStorage.getItem("done")||"[]");
  todos.push(done[idx]); done.splice(idx,1);
  saveTodos(todos,done); loadTodos();
}
function clearDone(){ saveTodos(JSON.parse(localStorage.getItem("todos")||"[]"),[]); loadTodos(); }
loadTodos();
</script>

</body>
</html>
