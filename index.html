<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jake's Dashboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      color: #000;
      font-family: "Georgia", serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-size: 14px; /* smaller overall */
    }

    /* Fake landscape layout */
    .wrapper {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      transform-origin: center center;
      box-sizing: border-box;
      padding: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100%;
      height: 100%;
      gap: 4px;
    }

    .module {
      border: 1px solid black;
      padding: 10px;
      box-sizing: border-box;
      overflow: hidden;
      border-radius: 4px;
    }

    h2 {
      margin: 0 0 4px 0;
      font-size: 1.1em;
      border-bottom: 1px solid #000;
      padding-bottom: 4px;
    }

    ul {
      padding-left: 20px;
      margin: 0;
      font-size: 1em;
      line-height: 1.3;
    }

    p, li, div {
      font-size: 1em;
    }

    #todos input[type="checkbox"] {
      transform: scale(1.1);
      margin-right: 6px;
    }

    input#new-todo {
      font-size: 1em;
      padding: 3px;
      margin-top: 4px;
      border: 1px solid #333;
      width: 70%;
    }

    button#add-todo {
      font-size: 1em;
      padding: 3px 6px;
      margin-left: 4px;
    }

    .weather-line {
      margin: 3px 0;
    }

    /* On very narrow (portrait) devices like Kindle, simulate landscape */
    @media screen and (orientation: portrait) {
      .wrapper {
        transform: rotate(90deg);
        transform-origin: left top;
        position: absolute;
        top: 0;
        left: 0;
        width: 100vh;
        height: 100vw;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="grid">
      <!-- Calendar -->
      <div class="module" id="calendar">
        <h2>📅 Calendar</h2>
        <ul>
          <li>Oct 29 – Grocery pickup</li>
          <li>Oct 30 – Dinner w/ family</li>
          <li>Oct 31 – Trick or treat 🎃</li>
          <li>Nov 1 – Church activity</li>
        </ul>
      </div>

      <!-- Weather -->
      <div class="module" id="weather">
        <h2>🌤 Weather (Melissa, TX)</h2>
        <div id="weather-content">Loading weather...</div>
      </div>

      <!-- Daily Quote -->
      <div class="module" id="quote">
        <h2>💬 Daily Quote</h2>
        <p id="quote-text">“Do what you can, with what you have, where you are.” — Theodore Roosevelt</p>
      </div>

      <!-- To-Dos -->
      <div class="module" id="todos">
        <h2>✅ To-Dos</h2>
        <ul id="todo-list"></ul>
        <div>
          <input id="new-todo" type="text" placeholder="Add task...">
          <button id="add-todo">Add</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---- Weather (old-school request for Kindle) ----
    function updateWeather() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=33.285&longitude=-96.5717&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph");
      xhr.onload = function() {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            var w = data.current_weather;
            document.getElementById("weather-content").innerHTML = 
              "<div class='weather-line'>Temp: " + w.temperature + "°F</div>" +
              "<div class='weather-line'>Wind: " + w.windspeed + " mph</div>";
          } catch(e) {
            document.getElementById("weather-content").innerText = "Parse error.";
          }
        } else {
          document.getElementById("weather-content").innerText = "No data.";
        }
      };
      xhr.onerror = function() {
        document.getElementById("weather-content").innerText = "Offline.";
      };
      xhr.send();
    }
    updateWeather();

    // ---- To-Dos ----
    var list = document.getElementById("todo-list");
    var input = document.getElementById("new-todo");
    var addBtn = document.getElementById("add-todo");

    function loadTodos() {
      var todos = JSON.parse(localStorage.getItem("todos") || "[]");
      list.innerHTML = "";
      for (var i = 0; i < todos.length; i++) {
        var li = document.createElement("li");
        li.innerHTML = "<input type='checkbox' " + (todos[i].done ? "checked" : "") + " data-idx='" + i + "'>" + todos[i].text;
        list.appendChild(li);
      }
    }

    function saveTodos() {
      var todos = [];
      var items = list.querySelectorAll("li");
      for (var i = 0; i < items.length; i++) {
        var cb = items[i].querySelector("input");
        todos.push({ text: cb.nextSibling.textContent, done: cb.checked });
      }
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    function addTodo() {
      if (input.value.trim() === "") return;
      var todos = JSON.parse(localStorage.getItem("todos") || "[]");
      todos.push({ text: input.value.trim(), done: false });
      localStorage.setItem("todos", JSON.stringify(todos));
      input.value = "";
      loadTodos();
    }

    addBtn.onclick = addTodo;
    input.onchange = addTodo; // fallback for Kindle keyboard
    list.onchange = saveTodos;

    loadTodos();
  </script>
</body>
</html>
