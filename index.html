<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jake's Kindle Dashboard</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #fff;
    color: #000;
    font-family: Georgia, serif;
    font-size: 20px;
    display: flex;
    justify-content: center;
  }

  .wrapper {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: repeat(4, auto);
    gap: 8px;
    width: 600px;
    padding: 10px;
    box-sizing: border-box;
  }

  .module {
    border: 1px solid black;
    padding: 12px;
    border-radius: 4px;
    box-sizing: border-box;
    overflow: hidden;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.15em; /* header slightly smaller */
    border-bottom: 1px solid #000;
    padding-bottom: 6px;
    display: flex;
    align-items: center;
  }

  h2 svg {
    width: 24px;
    height: 24px;
    margin-right: 6px;
    fill: none;
    stroke: black;
    stroke-width: 2;
  }

  ul {
    padding-left: 20px;
    margin: 0;
    font-size: 1em;
    line-height: 1.4;
  }

  p, li, div {
    font-size: 1em;
  }

  #todos input[type="checkbox"] {
    transform: scale(1.1);
    margin-right: 6px;
  }

  input#new-todo {
    font-size: 1em;
    padding: 4px;
    margin-top: 6px;
    border: 1px solid #333;
    width: 70%;
  }

  button {
    font-size: 1em;
    padding: 4px 8px;
    margin-left: 4px;
  }

  #completed-list {
    margin-top: 10px;
    border-top: 1px solid #888;
    padding-top: 5px;
    font-size: 0.95em;
  }

  .weather-line { margin: 3px 0; }
</style>
</head>
<body>

<div class="wrapper">
  <!-- Calendar -->
  <div class="module" id="calendar">
    <h2>
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Calendar
    </h2>
    <ul></ul>
  </div>

  <!-- Weather -->
  <div class="module" id="weather">
    <h2>
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"/><ellipse cx="16" cy="14" rx="6" ry="4"/>
      </svg>
      Weather
    </h2>
    <div id="weather-content">Loading weather...</div>
  </div>

  <!-- Daily Quote -->
  <div class="module" id="quote">
    <h2>
      <svg viewBox="0 0 24 24"><path d="M4 21v-7a5 5 0 0 1 5-5h1v-2h-1a7 7 0 0 0-7 7v7h7v-2H6zM14 21v-7a5 5 0 0 1 5-5h1v-2h-1a7 7 0 0 0-7 7v7h7v-2h-5z"/></svg>
      Daily Quote
    </h2>
    <p id="quote-text">“Do what you can, with what you have, where you are.” — Theodore Roosevelt</p>
  </div>

  <!-- To-Dos -->
  <div class="module" id="todos">
    <h2>
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      To-Dos
    </h2>
    <ul id="todo-list"></ul>
    <div>
      <input id="new-todo" type="text" placeholder="Add task...">
      <button onclick="addTodo()">Add</button>
    </div>
    <div id="completed-list">
      <strong>Completed:</strong>
      <ul id="done-list"></ul>
      <button onclick="clearDone()">Clear Completed</button>
    </div>
  </div>
</div>

<script>
  // --- Calendar using CORS proxy ---
  var icsUrl = "https://p157-caldav.icloud.com/published/2/MjAzMDk4MjAyNTcyMDMwOWelqCDmoGrZl0HbDRwh4THxwVTjex_ugi0QuWfxMzqeyjBGGFltleGeYl57ChEM7SaryzOAF7EjZcsTepi0Pwg";
  var proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(icsUrl);

  function fetchCalendar() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", proxyUrl);
    xhr.onload = function() {
      if(xhr.status===200){
        var icsText = JSON.parse(xhr.responseText).contents;
        var events = parseICS(icsText);
        displayNextEvents(events, 4);
      } else {
        document.querySelector("#calendar ul").innerHTML = "<li>Unable to load calendar.</li>";
      }
    };
    xhr.onerror = function() {
      document.querySelector("#calendar ul").innerHTML = "<li>Offline.</li>";
    };
    xhr.send();
  }

  function parseICS(icsText){
    var events=[], lines=icsText.split(/\r?\n/), current={};
    lines.forEach(line=>{
      if(line.startsWith("BEGIN:VEVENT")) current={};
      if(line.startsWith("SUMMARY:")) current.summary=line.replace("SUMMARY:","");
      if(line.startsWith("DTSTART")){
        var dt=line.split(":")[1];
        current.date=new Date(dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8)+'T'+dt.slice(9,11)+':'+dt.slice(11,13));
      }
      if(line.startsWith("END:VEVENT") && current.date && current.summary) events.push(current);
    });
    return events.sort((a,b)=>a.date-b.date);
  }

  function displayNextEvents(events,count){
    var now=new Date();
    var upcoming=events.filter(e=>e.date>=now).slice(0,count);
    var ul=document.querySelector("#calendar ul"); ul.innerHTML="";
    upcoming.forEach(ev=>{
      var li=document.createElement("li");
      li.textContent=ev.date.toLocaleDateString()+" – "+ev.summary;
      ul.appendChild(li);
    });
  }

  fetchCalendar();

  // --- Weather ---
  function updateWeather(){
    var xhr=new XMLHttpRequest();
    xhr.open("GET","https://api.open-meteo.com/v1/forecast?latitude=33.285&longitude=-96.5717&current_weather=true&daily=temperature_2m_max,precipitation_probability_max&temperature_unit=fahrenheit&windspeed_unit=mph&timezone=auto");
    xhr.onload=function(){
      if(xhr.status===200){
        try{
          var data=JSON.parse(xhr.responseText);
          var current=data.current_weather;
          var tempNow=Math.round(current.temperature);
          var wind=Math.round(current.windspeed);
          var tomorrowTemp=Math.round(data.daily.temperature_2m_max[1]);
          var rain=data.daily.precipitation_probability_max[1]||0;
          var html="";
          html+="<div class='weather-line'>Now: "+tempNow+"°F, "+wind+" mph wind</div>";
          html+="<div class='weather-line'>Tomorrow: "+tomorrowTemp+"°F"+(rain>0?", "+rain+"% rain":"")+"</div>";
          document.getElementById("weather-content").innerHTML=html;
        }catch(e){
          document.getElementById("weather-content").innerText="Error parsing weather.";
        }
      } else { document.getElementById("weather-content").innerText="No data."; }
    };
    xhr.onerror=function(){document.getElementById("weather-content").innerText="Offline.";}
    xhr.send();
  }
  updateWeather();

  // --- To-Dos ---
  function loadTodos(){
    var todos=JSON.parse(localStorage.getItem("todos")||"[]");
    var done=JSON.parse(localStorage.getItem("done")||"[]");
    var list=document.getElementById("todo-list");
    var doneList=document.getElementById("done-list");
    list.innerHTML=""; doneList.innerHTML="";
    for(var i=0;i<todos.length;i++){
      var li=document.createElement("li");
      li.innerHTML="<input type='checkbox' data-idx='"+i+"' onclick='markDone(this)'>"+todos[i].text;
      list.appendChild(li);
    }
    for(var i=0;i<done.length;i++){
      var li=document.createElement("li");
      li.innerHTML="<input type='checkbox' checked data-idx='"+i+"' onclick='unmarkDone(this)'>"+done[i].text;
      doneList.appendChild(li);
    }
  }

  function saveTodos(todos,done){
    localStorage.setItem("todos",JSON.stringify(todos));
    localStorage.setItem("done",JSON.stringify(done));
  }

  function addTodo(){
    var input=document.getElementById("new-todo"); var val=input.value.trim(); if(!val) return;
    var todos=JSON.parse(localStorage.getItem("todos")||"[]"); todos.push({text:val});
    localStorage.setItem("todos",JSON.stringify(todos)); input.value=""; loadTodos();
  }

  function markDone(cb){
    var idx=parseInt(cb.getAttribute("data-idx"));
    var todos=JSON.parse(localStorage.getItem("todos")||"[]");
    var done=JSON.parse(localStorage.getItem("done")||"[]");
    done.push(todos[idx]); todos.splice(idx,1); saveTodos(todos,done); loadTodos();
  }

  function unmarkDone(cb){
    var idx=parseInt(cb.getAttribute("data-idx"));
    var todos=JSON.parse(localStorage.getItem("todos")||"[]");
    var done=JSON.parse(localStorage.getItem("done")||"[]");
    todos.push(done[idx]); done.splice(idx,1); saveTodos(todos,done); loadTodos();
  }

  function clearDone(){
    saveTodos(JSON.parse(localStorage.getItem("todos")||"[]"),[]);
    loadTodos();
  }

  loadTodos();
</script>

</body>
</html>
